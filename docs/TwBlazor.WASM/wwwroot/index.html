<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>twblazor | Tailwind CSS components for Blazor</title>
    <meta name="description" content="Professional-grade Tailwind CSS components for Blazor. Accessible, themeable, free and open-source components to help you ship polished .NET UIs faster." />
    <!-- No canonical here. Every route is served this same file, so a canonical
         in the shell tells Google that /button, /dialog and the rest are all
         duplicates of the home page, and they get dropped from the index as
         "Alternate page with proper canonical tag". Each page declares its own
         canonical through HeadContent instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="twblazor" />
    <meta property="og:title" content="twblazor - Tailwind CSS components for Blazor" />
    <meta property="og:description" content="Professional-grade Tailwind CSS components for Blazor. Accessible, themeable, free and open-source components to help you ship polished .NET UIs faster." />
    <meta property="og:url" content="https://twblazor.com/" />
    <meta property="og:image" content="https://twblazor.com/_content/TwBlazor.Docs/images/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="twblazor - Tailwind CSS components for Blazor" />
    <meta name="twitter:description" content="Professional-grade Tailwind CSS components for Blazor. Accessible, themeable, free and open-source components to help you ship polished .NET UIs faster." />
    <meta name="twitter:image" content="https://twblazor.com/_content/TwBlazor.Docs/images/logo.svg" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="_content/TwBlazor.Docs/images/logo.svg" />
    <link rel="stylesheet" href="_content/TwBlazor/icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="_content/TwBlazor/css/twblazor.css" />
    <link rel="stylesheet" href="_content/TwBlazor.Docs/css/output.css" />
</head>

<body>
    <div id="app" class="overflow-none">
        <div class="flex items-center justify-center h-screen dark:bg-gray-900">
            <output class="inline-flex flex-col items-center gap-3" aria-label="Loading">
                <span class="inline-block rounded-full animate-spin size-10 border-5 border-gray-200 dark:border-gray-700 border-t-purple-600 dark:border-t-purple-500" aria-hidden="true"></span>
                <p class="text-gray-700 dark:text-gray-100">Loading twblazor docs...</p>
            </output>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert" class="hidden fixed inset-x-0 bottom-0 z-130 box-border px-5 py-3 pr-10 text-sm shadow-[0_-1px_2px_rgba(0,0,0,0.2)] bg-amber-50 text-gray-900 dark:bg-neutral-800 dark:text-neutral-100">
        An unhandled error has occurred.
        <a href="" class="reload underline font-medium hover:no-underline">Reload</a>
        <a class="dismiss absolute right-3 top-2 cursor-pointer leading-none">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/TwBlazor/js/twblazor.js"></script>
    <script src="_content/TwBlazor.Docs/js/themeToggle.js"></script>
    <!-- highlight js -->
    <script src="_content/TwBlazor.Docs/js/highlight.min.js"></script>
</body>

</html>
