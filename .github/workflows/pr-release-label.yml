name: Release Bump Label

# Gate on develop -> main pull requests: exactly one of release:minor or
# release:major must be applied. publish-release.yml reads that label after the
# merge to decide the version it tags. Kept in its own workflow so that clicking
# a label re-runs only this check, not the whole build and Sonar suite.
#
# Make "Release Bump Label" a required status check on main to stop an unlabelled
# release PR merging.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-release-label:
    name: Verify Release Bump Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write         # create the labels, post the guidance comment
      pull-requests: write

    steps:
      - name: Ensure the release labels exist
        continue-on-error: true  # a fork PR's token is read-only; the check below still gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create 'release:major' --color 'B60205' --description 'Release this PR as a major version bump (1.2.3 -> 2.0.0)' --force
          gh label create 'release:minor' --color '0E8A16' --description 'Release this PR as a minor version bump (1.2.3 -> 1.3.0)' --force
          gh label create 'release:patch' --color '1D76DB' --description 'Release this PR as a patch version bump (1.2.3 -> 1.2.4). Applied by default.' --force

      - name: Default to release:patch
        # Only when the PR is opened or reopened. Doing this on every event would
        # fight a maintainer swapping labels: removing release:minor fires an
        # "unlabeled" event, patch would be re-added instantly, and adding the
        # replacement would then trip the "more than one label" error.
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        continue-on-error: true  # a fork PR's token is read-only; the check below still gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name' || true)"
          if echo "$CURRENT" | grep -qE '^release:(major|minor|patch)$'; then
            echo "A bump label is already present; leaving it as it is."
          else
            echo "No bump label on this new PR; defaulting to release:patch."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label 'release:patch'
          fi

      - name: Check for exactly one bump label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Read the labels live rather than from the event payload, so a label
          # the step above just applied is visible in this same run instead of
          # only after the resulting "labeled" event triggers another one.
          LABELS="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name' || true)"
          BUMPS="$(echo "$LABELS" | grep -E '^release:(major|minor|patch)$' | sort -u | xargs || true)"
          COUNT="$(echo "$BUMPS" | wc -w)"
          echo "Bump labels on this PR: ${BUMPS:-(none)}"

          if [ "$COUNT" -eq 1 ]; then
            echo "state=${BUMPS#release:}" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -gt 1 ]; then
            echo "state=multiple" >> "$GITHUB_OUTPUT"
            echo "applied=$BUMPS" >> "$GITHUB_OUTPUT"
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment with the current state
        continue-on-error: true  # a fork PR's token is read-only; the check below still gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATE: ${{ steps.check.outputs.state }}
          APPLIED: ${{ steps.check.outputs.applied }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- release-bump-label -->'

          TABLE="| Label | Result |
          |---|---|
          | \`release:major\` | breaking changes, e.g. \`1.2.3\` -> \`2.0.0\` |
          | \`release:minor\` | backwards compatible changes, e.g. \`1.2.3\` -> \`1.3.0\` |
          | \`release:patch\` | fixes only, e.g. \`1.2.3\` -> \`1.2.4\` (the default) |"

          case "$STATE" in
            major|minor|patch)
              BODY="$MARKER
          ### Release bump: $STATE

          Merging this PR will tag main with the next **$STATE** version and publish it to GitHub Packages **and NuGet.org**. A NuGet.org release cannot be deleted, only unlisted.

          To change it, remove the current label and add a different one. Do not add a second label, as that fails this check.

          $TABLE"
              ;;
            multiple)
              BODY="$MARKER
          ### Pick one release bump

          This PR carries more than one bump label ($APPLIED). Remove all but one so the release version is unambiguous."
              ;;
            *)
              BODY="$MARKER
          ### Choose the release bump

          This PR releases \`develop\` to \`main\` but carries no bump label. \`release:patch\` is normally applied automatically when a PR is opened, so add one by hand in the sidebar:

          $TABLE

          This check goes green as soon as exactly one is applied. Nothing in the repository needs editing: the version is created as a Git tag when the PR merges."
              ;;
          esac

          # Update the existing comment rather than adding one per re-run.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate             --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty")

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          fi

      - name: Fail unless exactly one label is applied
        env:
          STATE: ${{ steps.check.outputs.state }}
          APPLIED: ${{ steps.check.outputs.applied }}
        shell: bash
        run: |
          case "$STATE" in
            major|minor|patch)
              echo "Release bump: $STATE"
              ;;
            multiple)
              echo "::error::This PR carries more than one release bump label ($APPLIED). Remove all but one so the release version is unambiguous."
              exit 1
              ;;
            *)
              echo "::error::Add one of release:major, release:minor or release:patch to choose how this release moves the version."
              exit 1
              ;;
          esac
