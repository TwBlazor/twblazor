name: PR checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  lint-pr-title:
    name: Lint PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Validate PR title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "SKIP - No PR found (manual dispatch), skipping title validation."
            exit 0
          fi
          if [ "$PR_USER" == "dependabot[bot]" ]; then
            echo "SKIP - Dependabot PR, skipping title validation."
            exit 0
          fi
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title -q .title)
          pattern="^(feat|fix|bug|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,100}$"
          if ! echo "$PR_TITLE" | grep -qP "$pattern"; then
            echo "ERROR - PR title does not follow Conventional Commits format."
            echo "   Title: $PR_TITLE"
            echo "   Expected format: <type>(<optional scope>): <description>"
            echo "   Example: feat: add button component"
            echo "   Valid types: feat, fix, bug, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "PASS - PR title is valid: $PR_TITLE"

  verify-branch-policy:
    name: Verify Branch Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Verify Source Branch
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$BASE_REF" == "main" ]; then
            # PRs to main must come from develop
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs to main must originate from develop branch"

            # Post comment to PR
            curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -d "{\"body\":\"## Branch Policy Violation\n\nPull requests to \`main\` must originate from the \`develop\` branch only.\n\n**Current source branch:** \`${HEAD_REF}\`\n**Target branch:** \`main\`\n\n### Why?\n\nAll feature branches, bug fixes, and other changes must first be merged into \`develop\` for integration testing. Only the \`develop\` branch should be merged to \`main\` for production releases.\n\n### What to do:\n\n1. Close this PR\n2. Create a PR from \`${HEAD_REF}\` to \`develop\` instead\n3. Once merged and tested, \`develop\` can be merged to \`main\`\n\nFor more information, see our [Contributing Guidelines](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md).\"}"

            exit 1
          fi
          fi

          echo "Branch policy check passed"

  auto-bump-version:
    name: Auto-bump Version
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0  # Required to diff version.json against origin/main

      - name: Bump minor version if needed
        shell: pwsh
        run: ./scripts/verify-version-bump.ps1 -BaseRef origin/main -HeadRef HEAD -Component Minor -Fix

      - name: Commit and push version bump
        shell: bash
        run: |
          if git diff --quiet -- version.json; then
            echo "version.json already bumped relative to main; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump minor version for main release"
          git push origin "HEAD:${{ github.head_ref }}"

  auto-bump-develop-version:
    name: Auto-bump Version (develop)
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0  # Required to diff version.json against origin/develop

      - name: Bump patch version (-beta) if needed
        shell: pwsh
        run: ./scripts/verify-version-bump.ps1 -BaseRef origin/develop -HeadRef HEAD -Component Patch -Fix

      - name: Commit and push version bump
        shell: bash
        run: |
          if git diff --quiet -- version.json; then
            echo "version.json already bumped relative to develop; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump patch version for develop"
          git push origin "HEAD:${{ github.head_ref }}"

  sonar-quality-gate:
    name: Sonar Quality Gate (develop)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check latest develop quality gate status
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=TwBlazor_twblazor&branch=develop")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"')
          if [ "$STATUS" != "OK" ]; then
            echo "::error::SonarCloud quality gate for develop is '$STATUS', not OK. Fix it on develop (which reruns the full scan) before merging to main."
            exit 1
          fi
          echo "SonarCloud quality gate for develop is OK - skipping a redundant rescan on main."

  header-check:
    name: Header Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate copyright headers
        shell: pwsh
        run: ./scripts/validate-headers.ps1

  build-and-test:
    name: Build and Test
    # Skip for develop -> main PRs: develop already ran (and re-runs on every
    # push to develop), and main only ever merges develop's already-validated
    # commit, so re-running here is redundant noise.
    if: "!(github.event_name == 'pull_request' && github.base_ref == 'main')"
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      checks: write
      contents: read
      actions: read
    with:
      configuration: Release

  sonarcloud-scan:
    name: SonarCloud Scan
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache SonarCloud packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests with coverage
        run: npm test

      - name: Normalize lcov paths
        shell: powershell
        run: |
          $lcov = "coverage\lcov.info"
          (Get-Content $lcov) -replace '\\', '/' -replace 'SF:TwBlazor/', 'SF:' | Set-Content $lcov

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"TwBlazor_twblazor" `
            /o:"twblazor" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.exclusions="TwBlazor.Docs/Examples/**,**/*.css,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico" `
            /d:sonar.cpd.exclusions="**/wwwroot/404.html" `
            /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/coverage/lcov.info" `
            /d:sonar.coverage.exclusions="TwBlazor.Docs/**,TwBlazor.Server/**,TwBlazor.Wasm/**,TwBlazor.WasmHost/**,TwBlazor.BuildTools/**,TwBlazor.Theme/**,TwBlazor.Docs.Compiler/**,**/Program.cs" `
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}\coverage\**\coverage.opencover*.xml"
          dotnet build --configuration Release
          dotnet test --no-build --configuration Release --results-directory "${{ github.workspace }}\coverage" -- --coverlet --coverlet-output-format opencover
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  vulnerability-scan:
    name: Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Full history required for Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(dotnet list package --vulnerable --include-transitive || true)"
          echo "$OUTPUT"
          if [ -z "${OUTPUT//[[:space:]]/}" ]; then
            echo "No output from dotnet list package assuming no vulnerable packages."
            exit 0
          fi
          if echo "$OUTPUT" | grep -qi -e "no vulnerable packages" -e "No vulnerable packages were found."; then
            echo "No vulnerable packages found."
            exit 0
          fi
          echo "::error ::Vulnerable packages detected in dependencies. See output above."
          exit 1