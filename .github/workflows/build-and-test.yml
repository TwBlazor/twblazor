name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Full history required for Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet build --configuration "$BUILD_CONFIGURATION" --no-restore
        
      - name: Test
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet test --configuration "$BUILD_CONFIGURATION" --no-build --verbosity normal --results-directory ./test-results -- --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Publish Test Results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: ./test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true
