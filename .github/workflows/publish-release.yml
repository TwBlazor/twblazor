name: Publish Release Package

# Cuts a stable release of main. The version is decided by the release:minor /
# release:major label on the pull request that was merged (enforced before merge
# by pr-release-label.yml), turned into a Git tag here. That tag is the only
# record of the version: MinVer reads it at build time, so nothing in the
# repository needs to be edited or committed in order to release.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this release'
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Build and Publish Release
    runs-on: ubuntu-latest

    # The app credentials live on this environment, not on the repository, and
    # the environment is restricted to the main branch.
    environment: release

    permissions:
      contents: write       # push the release tag, create the GitHub Release
      packages: write       # push the NuGet package
      id-token: write       # OIDC trusted publishing to NuGet.org
      pull-requests: read   # read the merged PR's release: label
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # GITHUB_TOKEN is subject to branch protection like any other actor, so it
      # cannot push the README commit below to a protected main. This app is on
      # the ruleset's bypass list; see CONTRIBUTING for the repository setup.
      # The tag push further down rides on the same credentials.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0    # MinVer needs full history to measure commit height
          fetch-tags: true  # ...and every release tag to find the base version

      - name: Determine version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch requested a '$INPUT_BUMP' bump."
            echo "bump=$INPUT_BUMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' || true)"
          echo "Labels on the pull request for $SHA: ${LABELS:-(none)}"

          # Matched generically and required to be unique. pr-release-label.yml
          # already blocks a PR carrying two bump labels, but this runs after the
          # merge and must not silently pick one if that gate was bypassed.
          BUMPS="$(echo "$LABELS" | grep -E '^release:(major|minor|patch)$' | sort -u | xargs || true)"
          COUNT="$(echo "$BUMPS" | wc -w)"

          if [ "$COUNT" -eq 1 ]; then
            echo "bump=${BUMPS#release:}" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -gt 1 ]; then
            echo "::error::The pull request for $SHA carries more than one release bump label ($BUMPS), so the version is ambiguous and nothing was published."
            exit 1
          else
            echo "::error::No release:major, release:minor or release:patch label found on the pull request for $SHA, so nothing was published. To release this commit, run this workflow manually (Actions -> Publish Release Package -> Run workflow) and choose a bump."
            exit 1
          fi

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          # Re-running the workflow on an already-released commit must not cut a
          # second version, so reuse the tag when HEAD already carries one.
          $existing = @(git tag --list --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          if ($existing.Count -gt 0) {
              $tag = $existing[0]
              Write-Host "HEAD is already tagged $tag; reusing that version."
              "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=$tag"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              ./scripts/next-release-version.ps1 -Bump '${{ steps.bump.outputs.bump }}'
          }

      # Deliberately ahead of the tag: the README commit has to be part of what
      # gets tagged, or HEAD would no longer carry the tag and the re-run guard
      # in "Compute release version" above would cut a second release. Pushing
      # before anything is tagged or published also means a rejected push (main
      # moved underneath us) fails the job with nothing half-released.
      - name: Point README install command at this release
        id: readme
        shell: pwsh
        run: ./scripts/update-readme-version.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Commit README
        if: steps.readme.outputs.changed == 'true'
        env:
          FLOATING: ${{ steps.readme.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] matters here: unlike GITHUB_TOKEN, pushes made with an app
          # token DO start new workflow runs. Without it this push re-triggers
          # this workflow, and that run has no pull request behind its commit,
          # so "Determine version bump" would fail and redden every release.
          git commit -m "docs: point README install command at $FLOATING [skip ci]"
          git push origin HEAD:main

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag has to exist locally before the build, because that is where
          # MinVer reads the version from.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "refs/tags/$TAG"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build Tailwind CSS (minified)
        shell: pwsh
        run: |
          $version = "v4.1.18"
          Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/$version/tailwindcss-linux-x64" -OutFile ./tailwindcss
          chmod +x ./tailwindcss
          ./tailwindcss -i TwBlazor/wwwroot/css/input.css -o TwBlazor/wwwroot/css/twblazor.css --minify

      - name: Build
        run: dotnet build TwBlazor/TwBlazor.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack TwBlazor/TwBlazor.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Verify packed version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./artifacts/TwBlazor.$VERSION.nupkg" ]; then
            echo "::error::Expected ./artifacts/TwBlazor.$VERSION.nupkg but MinVer produced something else:"
            ls -1 ./artifacts
            exit 1
          fi
          echo "Packed TwBlazor $VERSION"

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/TwBlazor/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: NuGet login (OIDC → temp API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_ORG_USERNAME }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg             --source "https://api.nuget.org/v3/index.json"             --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"             --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            # --generate-notes takes no formatting options, so call the same API
            # it calls and edit the result: GitHub writes each entry as
            # "<title> by @user in <url>", and we want it without the "by".
            # Anchored on the trailing " in " so a "by" inside a PR title is
            # left alone.
            NOTES="$(gh api "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body |
              sed -E 's/ by (@[A-Za-z0-9-]+ in )/ \1/g')"
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" ./artifacts/*.nupkg
          fi
