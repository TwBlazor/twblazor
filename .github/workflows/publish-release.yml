name: Publish Release Package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Required for nbgv to calculate version from Git history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build Tailwind CSS (minified)
        shell: pwsh
        run: |
          $version = "v4.1.18"
          Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/$version/tailwindcss-linux-x64" -OutFile ./tailwindcss
          chmod +x ./tailwindcss
          ./tailwindcss -i TwBlazor/wwwroot/css/input.css -o TwBlazor/wwwroot/css/twblazor.css --minify

      - name: Build
        run: dotnet build TwBlazor/TwBlazor.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack TwBlazor/TwBlazor.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/TwBlazor/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_ORG_USERNAME }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
