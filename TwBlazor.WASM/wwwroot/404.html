<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>twblazor | Tailwind CSS components for Blazor</title>
    <meta name="description" content="Professional-grade Tailwind CSS components for Blazor. Accessible, themeable, free and open-source components to help you ship polished .NET UIs faster." />
    <base href="/" />
    <link rel="stylesheet" href="_content/TwBlazor/icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="_content/TwBlazor/css/twblazor.css" />
    <link rel="stylesheet" href="_content/TwBlazor.Docs/css/output.css" />
</head>

<body>
    <div id="app" class="overflow-none">
        <div class="flex items-center justify-center h-screen">
            <output class="inline-flex flex-col items-center gap-3" aria-label="Loading">
                <span class="inline-block rounded-full animate-spin size-12 border-4 border-gray-200 dark:border-gray-700 border-t-blue-600 dark:border-t-blue-500" aria-hidden="true"></span>
                <p class="text-lg text-gray-700 dark:text-gray-300">Loading twblazor docs...</p>
            </output>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/TwBlazor/js/twblazor.js"></script>
    <script src="_content/TwBlazor.Docs/js/themeToggle.js"></script>
    <!-- highlight js -->
    <script src="_content/TwBlazor.Docs/js/highlight.min.js"></script>
</body>

</html>
